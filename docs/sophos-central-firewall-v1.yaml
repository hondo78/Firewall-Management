      summary: Retrieve groups
      description: Retrieve firewall groups.
      operationId: getGroups
      tags:
        - Firewall Groups
      parameters:
        - name: X-Tenant-ID
          in: header
          description: Tenant ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          description: 'The page number to fetch, starting with 1.'
          required: false
          schema:
            type: integer
            default: 1
        - in: query
          name: pageTotal
          description: >-
            Whether the number of pages should be calculated and returned in the
            response.
          required: false
          schema:
            type: boolean
            default: false
        - in: query
          name: pageSize
          description: The size of the page requested.
          required: false
          schema:
            type: integer
            default: 100
        - name: recurseSubgroups
          in: query
          description: Whether to include nested child groups or not.
          required: false
          schema:
            type: boolean
            default: false
        - name: search
          in: query
          description: Search.
          required: false
          schema:
            type: string
        - name: searchFields
          in: query
          description: 'Comma-separated fields to match. Valid fields are name, parentId.'
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Groups retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                description: Firewall groups.
                required:
                  - items
                  - pages
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      description: Firewall group.
                      required:
                        - id
