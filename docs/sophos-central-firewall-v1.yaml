  '/firewalls/{firewallId}':
    patch:
      x-soph-permissions: 'fwcm.firewall.group:write'
      summary: Update firewall
      description: Update firewalls with supplied values.
      operationId: updateFirewallById
      tags:
        - Firewalls
      parameters:
        - name: X-Tenant-ID
          in: header
          description: Tenant ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: firewallId
          in: path
          description: Firewall ID.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Firewall update.
              properties:
                name:
                  description: Firewall name.
                  type: string
                  minLength: 3
                  maxLength: 40
                geoLocation:
                  description: Geolocation.
                  type: object
                  required:
                    - latitude
                    - longitude
                  properties:
                    latitude:
                      description: Latitude.
                      type: string
                    longitude:
                      description: Longitude.
                      type: string
            examples:
              FirewallPatchRequest:
                value:
                  name: FW-label
                  geoLocation:
                    latitude: '20.64'
                    longitude: '122.43'
      responses:
        '200':
          description: Firewall updated successfully.
          content:
            application/json:
              schema:
                description: Firewall.
                type: object
                required:
                  - id
                  - tenant
                  - serialNumber
                  - hostname
                  - name
                  - externalIpv4Addresses
