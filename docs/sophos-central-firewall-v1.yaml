                          type: user
                          name: Jane Doe
                          accountType: partner
                          accountId: b2f5d2d4-a041-494c-a3a2-a45219b6349a
                    pages:
                      current: 1
                      total: 1
                      items: 1
                      size: 100
                      maxSize: 1000
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  correlationId:
