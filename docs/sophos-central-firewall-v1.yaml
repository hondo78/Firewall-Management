openapi: 3.0.0
info:
  description: This is the OAS 3.0 specification for the Firewall APIs in Sophos Central.
  version: 1.5.0
  contact:
    name: Sophos Central APIs
    email: apis@sophos.com
    url: 'https://developer.sophos.com'
  title: Firewall API
tags:
  - name: Firewall Config
    description: >-
      Retrieve threat-feeds, update threat-feeds, delete indicators, update
      indicator, retrieve indicator, query transaction.
  - name: Firewall Config Import Export
    description: >-
      Export and import firewall configurations, and retrieve the transaction
      details.
  - name: Firewall Groups
    description: >-
      Create group, update group, retrieve groups, delete group, retrieve
      synchronization status for the firewalls in a group.
  - name: Firewalls
    description: >-
      Retrieve firewalls, update firewalls, delete firewalls from Sophos
      Central.
servers:
  - url: 'https://api-{dataRegion}.central.sophos.com/firewall/v1'
    description: Regional service in the production environment.
    variables:
      dataRegion:
        description: The data region where tenant data is stored.
        default: eu01
        enum:
          - eu01
          - eu02
          - us01
          - us02
          - us03
          - ca01
          - au01
          - jp01
          - in01
          - br01
          - ae01
security:
  - bearerAuth: []
paths:
  /firewalls:
    get:
      x-soph-permissions: 'fwcm.firewall.group:read'
      summary: List of firewalls
      description: List of firewalls.
      operationId: listFirewalls
      tags:
        - Firewalls
      parameters:
        - name: X-Tenant-ID
          in: header
          description: Tenant ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          description: 'The page number to fetch, starting with 1.'
          required: false
          schema:
            type: integer
            default: 1
        - in: query
          name: pageTotal
          description: >-
            Whether the number of pages should be calculated and returned in the
            response.
          required: false
          schema:
            type: boolean
            default: false
        - in: query
          name: pageSize
          description: The size of the page requested.
          required: false
          schema:
            type: integer
            default: 100
        - name: groupId
          in: query
          description: >-
            Firewall group ID, or 'ungrouped'. 'ungrouped' is a virtual group
            that hold all firewalls that aren't part of a firewall group.
          required: false
          schema:
            type: string
        - name: search
          in: query
          description: Search.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of firewalls.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - pages
                properties:
                  items:
                    type: array
                    description: Firewalls.
                    items:
                      description: Firewall.
                      type: object
                      required:
                        - id
                        - tenant
                        - serialNumber
                        - hostname
                        - name
                        - externalIpv4Addresses
                        - status
                        - createdBy
                        - createdAt
                      properties:
                        id:
                          type: string
                          format: uuid
                        cluster:
                          type: object
                          description: High availability cluster.
                          required:
                            - id
                            - mode
                            - status
                            - peers
                          properties:
                            id:
                              type: string
                              format: uuid
                            mode:
                              description: High availability mode.
                              type: string
                              format: enum
                              enum:
                                - activeActive
                                - activePassive
                            status:
                              description: High availability status.
                              type: string
                              format: enum
                              enum:
                                - auxiliary
                                - primary
                                - standalone
                                - fault
                            peers:
                              type: array
                              description: >-
                                Auxiliary firewall for high availability primary
                                firewall or vice-versa.
                              items:
                                type: object
                                required:
                                  - id
                                  - serialNumber
                                properties:
                                  id:
                                    type: string
                                    format: uuid
                                  serialNumber:
                                    type: string
                        tenant:
                          type: object
                          description: Tenant ID.
                          required:
                            - id
                          properties:
                            id:
                              description: Tenant ID.
                              type: string
                              format: uuid
                        serialNumber:
                          type: string
                        group:
                          type: object
                          description: Group ID.
                          required:
                            - id
                          properties:
                            id:
                              type: string
                              format: uuid
                              description: Group ID.
                            name:
                              type: string
                              minLength: 1
                              maxLength: 250
                              description: Group name.
                        hostname:
                          type: string
                          minLength: 1
                          maxLength: 250
                        name:
                          type: string
                          minLength: 3
                          maxLength: 40
                        firmwareVersion:
                          type: string
                        externalIpv4Addresses:
                          type: array
                          items:
                            type: string
                            format: ipv4
                        model:
                          type: string
                        status:
                          type: object
                          description: Firewall status.
                          required:
                            - managingStatus
                            - reportingStatus
                            - connected
                            - suspended
                          properties:
                            managingStatus:
                              description: Shows if the firewall is managed.
                              type: string
                              format: enum
                              enum:
                                - approvedByCustomer
                                - approvalPending
                                - rejectedByCustomer
                                - revokedByCustomer
                                - revokedByPartner
                                - requestNotSent
                                - claimed
                                - unclaimed
                                - waitingForDeployment
                            reportingStatus:
                              description: Shows if Sophos Central Reporting is turned on.
                              type: string
                              format: enum
                              enum:
                                - approvedByCustomer
                                - approvalPending
                                - requestNotSent
                            connected:
                              type: boolean
                            suspended:
                              type: boolean
                        stateChangedAt:
                          type: string
                          format: date-time
                        capabilities:
                          type: array
                          description: Firewall capability.
                          items:
                            type: string
                            description: Firewall capability.
                            enum:
                              - highAvailability
                              - sdwanGroup
                              - configImport
                              - default
                              - sdwanMultiGroup
                              - cloudAutoScale
                        createdBy:
                          type: object
                          required:
                            - accountType
                            - accountId
                          properties:
                            id:
                              description: Principal email or client ID.
                              type: string
                            type:
                              description: Principal type.
                              type: string
                              format: enum
                              enum:
                                - user
                                - service
                            name:
                              description: User principal name.
                              type: string
                            accountType:
                              type: string
                              description: Account type.
                              enum:
                                - partner
                                - tenant
                            accountId:
                              description: Account ID.
                              type: string
                              format: uuid
                        createdAt:
                          type: string
                          format: date-time
                        updatedBy:
                          type: object
                          required:
                            - accountType
                            - accountId
                          properties:
                            id:
                              description: Principal email or client ID.
                              type: string
                            type:
                              description: Principal type.
                              type: string
                              format: enum
                              enum:
                                - user
                                - service
                            name:
                              description: User principal name.
                              type: string
                            accountType:
                              type: string
                              description: Account type.
                              enum:
                                - partner
                                - tenant
                            accountId:
                              description: Account ID.
                              type: string
                              format: uuid
                        updatedAt:
                          type: string
                          format: date-time
                        geoLocation:
                          description: Geolocation.
                          type: object
                          required:
                            - latitude
                            - longitude
                          properties:
                            latitude:
                              description: Latitude.
                              type: string
                            longitude:
                              description: Longitude.
                              type: string
                    uniqueItems: true
                  pages:
                    type: object
                    description: Pagination information for the response object.
                    required:
                      - current
                      - size
                      - maxSize
                    properties:
                      current:
                        type: integer
                        description: The 1-based page number being returned.
                      total:
                        type: integer
                        description: >-
                          (Optional) The total number of pages that exist, if
                          pageTotal=true in the request.
                      items:
                        type: integer
                        description: >-
                          (Optional) The total number of items across all pages,
                          if pageTotal=true in the request.
                      size:
                        type: integer
                        description: The size of the page being returned.
                      maxSize:
                        type: integer
                        description: The maximum page size that can be requested.
              examples:
                Firewalls:
                  value:
                    items:
                      - id: 39df20ba-7330-41ae-9071-0ac682bdd1e6
                        cluster:
                          id: 6a72014b-ae91-4d50-807a-d3601e44b9b7
                          mode: activeActive
                          status: primary
                          peers:
                            id: e2875239-be72-4b3e-85f2-37ec51fe3cbd
                            serialNumber: SFDemo-ta-xgs107w-07
                        tenant:
                          id: 3e382b8e-49fd-4cd9-8360-a364371d7650
                        serialNumber: C01001JYCGB4J30
                        group:
                          id: ab83681f-aff6-4c2d-b0e5-1e9960fa5ce7
                          name: Bangalore Group
                        hostname: FW-1
                        name: fw-label
                        externalIpv4Addresses:
