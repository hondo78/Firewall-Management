                        - createdAt
                      properties:
                        id:
                          description: Group ID.
                          type: string
                          format: uuid
                        name:
                          description: Group name.
                          type: string
                          minLength: 3
                          maxLength: 40
                        parentGroup:
                          type: object
                          description: Group ID.
                          required:
                            - id
                          properties:
