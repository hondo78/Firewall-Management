    delete:
      x-soph-permissions: 'fwcm.firewall.group:write'
      summary: Delete firewall
      description: Delete firewall using its ID.
      operationId: deleteFirewallById
      tags:
        - Firewalls
      parameters:
        - name: X-Tenant-ID
          in: header
          description: Tenant ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: firewallId
          in: path
          description: Firewall ID.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Firewall deleted successfully.
          content:
            application/json:
              schema:
                type: object
                description: Response to a previous request to delete an item.
                required:
                  - deleted
                properties:
                  deleted:
                    type: boolean
        '401':
