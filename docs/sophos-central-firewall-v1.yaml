                          suspended: false
                        stateChangedAt: '2022-04-01T17:49:26.400Z'
                        capabilities:
                          - sdwanGroup
                        geoLocation:
                          latitude: '20.64'
                          longitude: '22.43'
                        createdBy:
                          id: 9f0a6bf4-1fa6-407a-aa1d-4b888a626bb3
                          type: user
                          name: Joe Bloggs
                          accountType: tenant
                          accountId: 98be8a40-ea9e-488e-b7d1-200d924cdb54
                        createdAt: '2021-10-25T05:27:39.467Z'
                        updatedAt: '2022-04-01T18:08:26.472Z'
                        updatedBy:
