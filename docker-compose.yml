services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fwm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fwm}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fwm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-fwm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fwm}
      FWM_MASTER_KEY: ${FWM_MASTER_KEY:?FWM_MASTER_KEY fehlt in .env}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_HOURS: ${JWT_HOURS:-10}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TZ: ${TZ:-Europe/Berlin}
      SOPHOS_ID_URL: ${SOPHOS_ID_URL:-https://id.sophos.com}
      SOPHOS_API_URL: ${SOPHOS_API_URL:-https://api.central.sophos.com}
      SYSLOG_HOST: ${SYSLOG_HOST:-}
      SYSLOG_PORT: ${SYSLOG_PORT:-514}
      SYSLOG_PROTOCOL: ${SYSLOG_PROTOCOL:-udp}
      BACKUP_DIR: /backups
    volumes:
      # Sicherungsdateien (nur wenn „zusätzlich als Datei ablegen“ aktiv ist)
      - ./backups:/backups
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FWM_PORT:-8096}:80"

  # Attrappe für Sophos Central + Firewall-XML-API (nur Entwicklung/Demo; Profil „mock“, siehe .env)
  sophos-mock:
    build: ./mock
    profiles: ["mock"]
    restart: unless-stopped
    environment:
      MOCK_PUBLIC_URL: http://sophos-mock:8000
      MOCK_CLIENT_ID: ${MOCK_CLIENT_ID:-mock-client}
      MOCK_CLIENT_SECRET: ${MOCK_CLIENT_SECRET:-mock-secret}
      MOCK_FW_USER: ${MOCK_FW_USER:-apiadmin}
      MOCK_FW_PASSWORD: ${MOCK_FW_PASSWORD:-mock-password}
      MOCK_API_KEY: ${MOCK_API_KEY:-sfos_mock_key}
    expose:
      - "8000"

volumes:
  db_data:
