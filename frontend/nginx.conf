server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 25m;

    # Docker-DNS dynamisch nutzen: sonst zeigt nginx nach einem Neubau des Backends auf dessen alte IP
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Synchronisation über Sophos Central (Export) kann dauern
        proxy_read_timeout 600s;
    }

    # Gebaute Dateien tragen einen Hash im Namen → dauerhaft cachebar. Fehlende Dateien NICHT durch index.html
    # ersetzen: sonst lädt ein Browser mit veralteter index.html HTML als JavaScript → weiße Seite.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
        # index.html immer neu laden, damit nach einem Update die aktuellen Asset-Namen verwendet werden
        add_header Cache-Control "no-cache";
    }
}
