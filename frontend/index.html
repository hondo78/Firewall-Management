<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%232006F7'/><path d='M8 10h16M8 16h16M8 22h10' stroke='white' stroke-width='3' stroke-linecap='round'/></svg>" />
    <title>Firewall-Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Falls das Programm nicht startet (z. B. veraltete Seite im Browser-Cache): Hinweis statt weißer Seite
      setTimeout(function () {
        var r = document.getElementById('root')
        if (r && !r.childElementCount) r.innerHTML = '<div style="font-family:system-ui,sans-serif;padding:48px 16px;text-align:center">' +
          '<h2>Die Anwendung konnte nicht geladen werden</h2><p>Bitte die Seite neu laden (Strg+F5 bzw. Cmd+Shift+R).</p>' +
          '<button onclick="location.reload(true)" style="padding:8px 16px">Neu laden</button></div>'
      }, 8000)
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
